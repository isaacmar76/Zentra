name: Zentra CI/CD - Compilación y Distribución ($0 USD)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-apk:
    name: Compilar APK Android para Celular
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias Flutter
        working-directory: ./zentra
        run: flutter pub get

      - name: Compilar APK Android Release
        working-directory: ./zentra
        run: flutter build apk --release --no-tree-shake-icons

      - name: Subir APK Android como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: zentra-app-release-apk
          path: zentra/build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar Release directa con el APK en GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.2.1-clean-release
          name: Zentra V1.2.1 - App Móvil Limpia para Pruebas
          body: |
            ### 📱 Zentra V1.2.1 - Versión para Pruebas en Celular (Base Limpia)
            Descarga directamente el archivo **`app-release.apk`** en tu celular Android para instalar y probar:
            - **Base Limpia**: Sin datos de prueba para que registres tu propio negocio desde cero.
            - **Modelo Fijo**: Eliges Servicios o Retail al iniciar y la aplicación siempre abrirá según tu tipo de negocio.
            - **Modo Servicios**: Gestión de pedidos por fases (Diseño, Producción, Empaque, Entregado), checklist con compras integradas y cotización instantánea por WhatsApp.
            - **Modo Retail**: Catálogo, inventario, punto de venta ágil y balance de caja.
            - **Temas Visuales**: Paletas de color premium (Nude & Blush, Esmeralda, Lavanda, Océano).
          files: zentra/build/app/outputs/flutter-apk/app-release.apk

  build-web:
    name: Compilar Versión Web / PWA
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Habilitar Flutter Web
        run: flutter config --enable-web

      - name: Instalar dependencias
        working-directory: ./zentra
        run: flutter pub get

      - name: Compilar Web Release
        working-directory: ./zentra
        run: flutter build web --release --base-href "/Zentra/" --no-tree-shake-icons

      - name: Subir versión Web como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: zentra-web-build
          path: zentra/build/web
