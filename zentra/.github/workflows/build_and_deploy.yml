name: Zentra CI/CD - Compilación y Despliegue ($0 USD)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar Zentra Web y APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        working-directory: ./zentra
        run: flutter pub get

      - name: Compilar Versión Web
        working-directory: ./zentra
        run: flutter build web --release

      - name: Compilar APK Android
        working-directory: ./zentra
        run: flutter build apk --release

      - name: Publicar APK compilado como artefacto de descarga
        uses: actions/upload-artifact@v4
        with:
          name: zentra-app-release-apk
          path: zentra/build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar versión Web compilada
        uses: actions/upload-artifact@v4
        with:
          name: zentra-web-build
          path: zentra/build/web
